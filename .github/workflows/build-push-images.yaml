name: Build and push images to GHCR

on:
  push:
    branches:
      - restapi-jwt-jwks-mount
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.1.0-restapi-jwt-jwks-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker buildx bake --push
          echo "Pushed:"
          echo "  ghcr.io/${{ github.repository_owner }}/slurm-operator:${VERSION}"
          echo "  ghcr.io/${{ github.repository_owner }}/slurm-operator-webhook:${VERSION}"
